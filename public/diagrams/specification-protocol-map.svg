<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Specification Protocol Map">

<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
</defs>

<style>
  .title{font:700 18px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#111827}
  .caption{font:500 12px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .label{font:600 13px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#111827}
  .sub{font:500 11px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .tiny{font:500 10px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .group-title{font:700 12px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#334155}
  .box{stroke:#8fb5ff;stroke-width:1.4;fill:#eef5ff;rx:10;ry:10}
  .box-green{stroke:#34d399;stroke-width:1.4;fill:#ecfdf5;rx:10;ry:10}
  .box-orange{stroke:#fb923c;stroke-width:1.4;fill:#fff7ed;rx:10;ry:10}
  .box-purple{stroke:#a78bfa;stroke-width:1.4;fill:#f5f3ff;rx:10;ry:10}
  .box-gray{stroke:#cbd5e1;stroke-width:1.2;fill:#f8fafc;rx:10;ry:10}
  .group{stroke:#d7e3f8;stroke-width:1.2;stroke-dasharray:6 5;fill:#fbfdff;rx:14;ry:14}
  .arrow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow-blue)}
  .ctrl{stroke:#ea580c;stroke-width:1.7;fill:none;marker-end:url(#arrow-orange)}
  .async{stroke:#6b7280;stroke-width:1.6;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow-gray)}
</style>

<rect width="960" height="560" fill="#ffffff"/>
<text x="40" y="36" class="title">Specification 契约层</text>
<text x="40" y="58" class="caption">protobuf / gRPC 是跨组件 wire contract；Control Plane 实现服务端，SDK / Sidecar / Controller 消费同一套消息</text>

<rect x="340" y="90" width="280" height="80" class="box-purple"/>
<text x="480" y="122" text-anchor="middle" class="label">specification / api/v1</text>
<text x="480" y="146" text-anchor="middle" class="sub">model · service · config · traffic · fault · security · ai</text>

<!-- consumers -->
<rect x="40" y="230" width="200" height="70" class="box"/>
<text x="140" y="258" text-anchor="middle" class="label">Control Plane</text>
<text x="140" y="280" text-anchor="middle" class="sub">服务端实现</text>

<rect x="270" y="230" width="200" height="70" class="box-green"/>
<text x="370" y="258" text-anchor="middle" class="label">Rust SDK</text>
<text x="370" y="280" text-anchor="middle" class="sub">Discover / Config gRPC</text>

<rect x="500" y="230" width="200" height="70" class="box-green"/>
<text x="600" y="258" text-anchor="middle" class="label">Sidecar / Mesh</text>
<text x="600" y="280" text-anchor="middle" class="sub">路由与策略消费</text>

<rect x="730" y="230" width="190" height="70" class="box-green"/>
<text x="825" y="258" text-anchor="middle" class="label">Controller</text>
<text x="825" y="280" text-anchor="middle" class="sub">同步与注入</text>

<path d="M420,170 L140,230" class="arrow"/>
<path d="M450,170 L370,230" class="arrow"/>
<path d="M510,170 L600,230" class="arrow"/>
<path d="M560,170 L825,230" class="arrow"/>

<!-- gRPC services -->
<rect x="40" y="340" width="880" height="180" class="group"/>
<text x="60" y="368" class="group-title">主要 gRPC / 契约入口</text>

<rect x="60" y="390" width="200" height="100" class="box"/>
<text x="160" y="422" text-anchor="middle" class="label">DiscoverGRPC</text>
<text x="160" y="444" text-anchor="middle" class="tiny">实例 · 规则 · 契约</text>
<text x="160" y="464" text-anchor="middle" class="tiny">:8091</text>

<rect x="280" y="390" width="200" height="100" class="box"/>
<text x="380" y="422" text-anchor="middle" class="label">ConfigGRPC</text>
<text x="380" y="444" text-anchor="middle" class="tiny">配置发布与发现</text>
<text x="380" y="464" text-anchor="middle" class="tiny">:8093</text>

<rect x="500" y="390" width="200" height="100" class="box-orange"/>
<text x="600" y="422" text-anchor="middle" class="label">WorkloadCredential</text>
<text x="600" y="444" text-anchor="middle" class="tiny">Issue / Renew</text>
<text x="600" y="464" text-anchor="middle" class="tiny">与管理鉴权分离</text>

<rect x="720" y="390" width="180" height="100" class="box-purple"/>
<text x="810" y="422" text-anchor="middle" class="label">MCP proto</text>
<text x="810" y="444" text-anchor="middle" class="tiny">Server / Tool 模型</text>
<text x="810" y="464" text-anchor="middle" class="tiny">管理 API 在控制面</text>
</svg>
