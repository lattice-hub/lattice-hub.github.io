<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Pole Sidecar Data Plane">

<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
</defs>

<style>
  .title{font:700 18px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#111827}
  .caption{font:500 12px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .label{font:600 13px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#111827}
  .sub{font:500 11px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .tiny{font:500 10px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .group-title{font:700 12px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#334155}
  .box{stroke:#8fb5ff;stroke-width:1.4;fill:#eef5ff;rx:10;ry:10}
  .box-green{stroke:#34d399;stroke-width:1.4;fill:#ecfdf5;rx:10;ry:10}
  .box-orange{stroke:#fb923c;stroke-width:1.4;fill:#fff7ed;rx:10;ry:10}
  .box-purple{stroke:#a78bfa;stroke-width:1.4;fill:#f5f3ff;rx:10;ry:10}
  .box-gray{stroke:#cbd5e1;stroke-width:1.2;fill:#f8fafc;rx:10;ry:10}
  .box-white{stroke:#d1d5db;stroke-width:1.2;fill:#ffffff;rx:10;ry:10}
  .group{stroke:#d7e3f8;stroke-width:1.2;stroke-dasharray:6 5;fill:#fbfdff;rx:14;ry:14}
  .arrow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow-blue)}
  .ctrl{stroke:#ea580c;stroke-width:1.7;fill:none;marker-end:url(#arrow-orange)}
  .async{stroke:#6b7280;stroke-width:1.6;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow-gray)}
  .read{stroke:#059669;stroke-width:1.7;fill:none;marker-end:url(#arrow-green)}
</style>

<rect width="960" height="420" fill="#ffffff"/>
<text x="40" y="36" class="title">Pole Sidecar 数据面</text>
<text x="40" y="58" class="caption">业务进程旁路本地代理：从控制面消费视图，在本地执行路由与转发</text>

<rect x="40" y="100" width="160" height="80" class="box-orange"/>
<text x="120" y="132" text-anchor="middle" class="label">业务应用</text>
<text x="120" y="154" text-anchor="middle" class="sub">HTTP / gRPC</text>

<rect x="260" y="90" width="420" height="220" class="group"/>
<text x="280" y="118" class="group-title">Pole Sidecar</text>
<rect x="290" y="140" width="160" height="60" class="box"/>
<text x="370" y="165" text-anchor="middle" class="label">Inbound</text>
<text x="370" y="185" text-anchor="middle" class="tiny">:8080 HTTP/1.1·H2</text>
<rect x="490" y="140" width="160" height="60" class="box"/>
<text x="570" y="165" text-anchor="middle" class="label">Route Match</text>
<text x="570" y="185" text-anchor="middle" class="tiny">grpc_prefix → prefix</text>
<rect x="290" y="220" width="160" height="60" class="box-purple"/>
<text x="370" y="245" text-anchor="middle" class="label">LB</text>
<text x="370" y="265" text-anchor="middle" class="tiny">round_robin</text>
<rect x="490" y="220" width="160" height="60" class="box-purple"/>
<text x="570" y="245" text-anchor="middle" class="label">Interceptors</text>
<text x="570" y="265" text-anchor="middle" class="tiny">ACL / 限流扩展点</text>

<rect x="740" y="100" width="180" height="80" class="box-green"/>
<text x="830" y="132" text-anchor="middle" class="label">上游集群</text>
<text x="830" y="154" text-anchor="middle" class="sub">endpoints</text>

<rect x="260" y="340" width="420" height="50" class="box-gray"/>
<text x="470" y="370" text-anchor="middle" class="label">Control Plane active 视图（发现 / 路由 / 配置）</text>

<path d="M200,140 L260,150" class="arrow"/>
<path d="M450,170 L490,170" class="arrow"/>
<path d="M370,200 L370,220" class="arrow"/>
<path d="M570,200 L570,220" class="ctrl"/>
<path d="M650,250 L740,150" class="read"/>
<path d="M470,340 L470,310" class="async"/>
</svg>
