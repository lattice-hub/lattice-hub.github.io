<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="Lattice Hub Deployment Architecture">

<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
  <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
</defs>

<style>
  .title{font:700 18px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#111827}
  .caption{font:500 12px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .label{font:600 13px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#111827}
  .sub{font:500 11px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .tiny{font:500 10px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#6b7280}
  .group-title{font:700 12px Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;fill:#334155}
  .box{stroke:#8fb5ff;stroke-width:1.4;fill:#eef5ff;rx:10;ry:10}
  .box-green{stroke:#34d399;stroke-width:1.4;fill:#ecfdf5;rx:10;ry:10}
  .box-orange{stroke:#fb923c;stroke-width:1.4;fill:#fff7ed;rx:10;ry:10}
  .box-purple{stroke:#a78bfa;stroke-width:1.4;fill:#f5f3ff;rx:10;ry:10}
  .box-gray{stroke:#cbd5e1;stroke-width:1.2;fill:#f8fafc;rx:10;ry:10}
  .box-white{stroke:#d1d5db;stroke-width:1.2;fill:#ffffff;rx:10;ry:10}
  .group{stroke:#d7e3f8;stroke-width:1.2;stroke-dasharray:6 5;fill:#fbfdff;rx:14;ry:14}
  .arrow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow-blue)}
  .ctrl{stroke:#ea580c;stroke-width:1.7;fill:none;marker-end:url(#arrow-orange)}
  .async{stroke:#6b7280;stroke-width:1.6;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow-gray)}
  .read{stroke:#059669;stroke-width:1.7;fill:none;marker-end:url(#arrow-green)}
</style>

<rect width="960" height="620" fill="#ffffff"/>
<text x="40" y="36" class="title">Lattice Hub 部署架构</text>
<text x="40" y="58" class="caption">最小可运行拓扑：MySQL 事实库 + Control Plane（all 模式）+ 可选观测栈</text>

<!-- Operators -->
<rect x="40" y="90" width="160" height="70" class="box-orange"/>
<text x="120" y="118" text-anchor="middle" class="label">平台工程师</text>
<text x="120" y="140" text-anchor="middle" class="sub">浏览器 / kubectl</text>

<!-- Console -->
<rect x="260" y="80" width="440" height="280" class="group"/>
<text x="280" y="104" class="group-title">pole-server --mode all</text>

<rect x="290" y="120" width="180" height="70" class="box"/>
<text x="380" y="148" text-anchor="middle" class="label">Console :8080</text>
<text x="380" y="170" text-anchor="middle" class="sub">静态资源 + 反向代理</text>

<rect x="500" y="120" width="180" height="70" class="box"/>
<text x="590" y="148" text-anchor="middle" class="label">HTTP API :8090</text>
<text x="590" y="170" text-anchor="middle" class="sub">REST / Admin / AI</text>

<rect x="290" y="210" width="120" height="60" class="box-purple"/>
<text x="350" y="235" text-anchor="middle" class="label">gRPC</text>
<text x="350" y="255" text-anchor="middle" class="tiny">8091 / 8093</text>

<rect x="430" y="210" width="120" height="60" class="box-purple"/>
<text x="490" y="235" text-anchor="middle" class="label">xDS v3</text>
<text x="490" y="255" text-anchor="middle" class="tiny">:15010</text>

<rect x="570" y="210" width="110" height="60" class="box-purple"/>
<text x="625" y="235" text-anchor="middle" class="label">兼容协议</text>
<text x="625" y="255" text-anchor="middle" class="tiny">Nacos/Apollo/Eureka</text>

<rect x="290" y="290" width="380" height="50" class="box-green"/>
<text x="480" y="312" text-anchor="middle" class="label">Domain Servers + CacheManager + Auth</text>
<text x="480" y="330" text-anchor="middle" class="tiny">Discover · Config · Governance · MCP/A2A</text>

<!-- Storage -->
<rect x="760" y="120" width="160" height="100" class="box-gray"/>
<text x="840" y="155" text-anchor="middle" class="label">MySQL</text>
<text x="840" y="178" text-anchor="middle" class="sub">pole_server</text>
<text x="840" y="198" text-anchor="middle" class="sub">pole_observability</text>

<!-- Optional obs -->
<rect x="760" y="250" width="160" height="90" class="box-white"/>
<text x="840" y="280" text-anchor="middle" class="label">可选观测</text>
<text x="840" y="302" text-anchor="middle" class="sub">OTel Collector</text>
<text x="840" y="322" text-anchor="middle" class="sub">GreptimeDB</text>

<!-- Clients -->
<rect x="40" y="420" width="880" height="150" class="group"/>
<text x="60" y="448" class="group-title">运行时消费者</text>

<rect x="70" y="470" width="180" height="70" class="box-green"/>
<text x="160" y="498" text-anchor="middle" class="label">Rust SDK</text>
<text x="160" y="520" text-anchor="middle" class="sub">Proxyless gRPC</text>

<rect x="280" y="470" width="180" height="70" class="box-green"/>
<text x="370" y="498" text-anchor="middle" class="label">Pole Sidecar</text>
<text x="370" y="520" text-anchor="middle" class="sub">本地数据面</text>

<rect x="490" y="470" width="180" height="70" class="box-green"/>
<text x="580" y="498" text-anchor="middle" class="label">K8s Controller</text>
<text x="580" y="520" text-anchor="middle" class="sub">Service 同步 / 注入</text>

<rect x="700" y="470" width="190" height="70" class="box-green"/>
<text x="795" y="498" text-anchor="middle" class="label">Proxy Mesh</text>
<text x="795" y="520" text-anchor="middle" class="sub">Envoy xDS 消费</text>

<!-- Arrows -->
<path d="M200,125 L260,145" class="ctrl"/>
<path d="M470,190 L470,210" class="arrow"/>
<path d="M680,155 L760,155" class="arrow"/>
<path d="M680,315 L760,290" class="async"/>
<path d="M380,360 L160,470" class="read"/>
<path d="M430,360 L370,470" class="read"/>
<path d="M500,360 L580,470" class="read"/>
<path d="M560,360 L795,470" class="read"/>

<text x="40" y="600" class="tiny">事实来源：deploy/conf/pole-server.yaml · deploy/conf/pole-apiserver.yaml · deploy/kubernetes/README.md</text>
</svg>
